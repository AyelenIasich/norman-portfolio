<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#110d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="60%">
      <stop offset="0" stop-color="#c0392b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#231515" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="url(#bg)"/>
  <rect width="1100" height="780" fill="url(#grid)" opacity="0.5"/>
  <rect width="1100" height="780" fill="url(#glow)"/>

  <!-- Border frame -->
  <rect x="28" y="28" width="1044" height="724" fill="none" stroke="#c0392b" stroke-width="2" rx="14"/>
  <rect x="40" y="40" width="1020" height="700" fill="none" stroke="#231515" stroke-width="1" rx="10"/>

  <!-- Corner ticks -->
  <path d="M60 92V60H92" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M1040 92V60H1008" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M60 688V720H92" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M1040 688V720H1008" fill="none" stroke="#fbbf24" stroke-width="3"/>

  <!-- Header -->
  <text x="550" y="132" text-anchor="middle" fill="#a07878" font-size="20" letter-spacing="6">TRYHACKME</text>
  <text x="550" y="150" text-anchor="middle" fill="#2ecc71" font-size="14" letter-spacing="2">&gt; certificate --verify</text>

  <!-- Title -->
  <text x="550" y="262" text-anchor="middle" fill="#f0eaea" font-size="58" font-weight="bold" letter-spacing="2">CERTIFICATE</text>
  <text x="550" y="306" text-anchor="middle" fill="#a07878" font-size="22" letter-spacing="8">OF COMPLETION</text>

  <line x1="380" y1="340" x2="720" y2="340" stroke="#c0392b" stroke-width="2"/>

  <!-- Awarded to -->
  <text x="550" y="392" text-anchor="middle" fill="#a07878" font-size="18">This certifies that</text>
  <text x="550" y="452" text-anchor="middle" fill="#c0392b" font-size="46" font-weight="bold">Norman Iasich</text>

  <!-- Course -->
  <text x="550" y="510" text-anchor="middle" fill="#a07878" font-size="18">has successfully completed the learning path</text>
  <text x="550" y="556" text-anchor="middle" fill="#f0eaea" font-size="34" font-weight="bold">Pre-Security</text>

  <!-- Footer meta -->
  <line x1="120" y1="636" x2="980" y2="636" stroke="#231515" stroke-width="1"/>

  <text x="150" y="678" fill="#a07878" font-size="15">DATE</text>
  <text x="150" y="702" fill="#f0eaea" font-size="18">2026</text>

  <text x="550" y="690" text-anchor="middle" fill="#fbbf24" font-size="14" letter-spacing="2">— SAMPLE / EJEMPLO —</text>

  <text x="950" y="678" text-anchor="end" fill="#a07878" font-size="15">ID</text>
  <text x="950" y="702" text-anchor="end" fill="#f0eaea" font-size="18">THM-PS-0001</text>
</svg>
